<main class="popup-container">
  <header class="popup-header">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
      </div>
      <div>
        <h1 class="brand-title">{{ config.name }}</h1>
        <p class="brand-subtitle">v{{ config.version }}</p>
      </div>
    </div>
    <span class="status-badge" [class.active]="status() === 'active'">
      {{ status() === 'ready' ? 'Ready' : 'Active' }}
    </span>
  </header>

  <section class="popup-content">
    <div class="empty-state">
      <div class="empty-state-icon">⚡</div>
      <h2 class="empty-state-title">Проєкт успішно ініціалізовано</h2>
      <p class="empty-state-desc">
        Базова структура розширення готова. У наступних кроках додамо відстеження слотів.
      </p>
    </div>
  </section>
</main>
