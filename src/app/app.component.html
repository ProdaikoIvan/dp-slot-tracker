<div class="popup-wrapper">
  <app-header [isRunning]="isRunning()" (toggleRun)="toggleRunning()" />

  <main class="content">
    @if (!isOnTargetSite()) {
      <app-not-on-site />
    } @else if (!isCenterSupported()) {
      <app-unsupported-center />
    } @else {
      <app-active-center />
    }
  </main>
</div>
