<header class="header">
  <div class="brand">
    <div class="brand-avatar">
      <app-icon name="document" [size]="18" />
    </div>
    <div class="brand-meta">
      <div class="brand-title-row">
        <h1 class="brand-name">{{ config.name }}</h1>
        <span class="brand-version">v{{ config.version }}</span>
      </div>
    </div>
  </div>

  <div class="header-actions">
    <button
      type="button"
      class="btn-icon"
      (click)="onReset()"
      title="Скинути до початкового стану"
      aria-label="Скинути до початкового стану"
    >
      <app-icon name="refresh" [size]="16" />
    </button>

    <button
      type="button"
      class="btn-icon"
      [class.is-active]="isSoundEnabled()"
      (click)="onToggleSound()"
      [attr.title]="isSoundEnabled() ? 'Вимкнути звук' : 'Увімкнути звук'"
      [attr.aria-label]="isSoundEnabled() ? 'Вимкнути звук' : 'Увімкнути звук'"
    >
      @if (isSoundEnabled()) {
        <app-icon name="bell" [size]="16" />
      } @else {
        <app-icon name="bell-off" [size]="16" />
      }
    </button>

    <button
      type="button"
      class="btn-icon"
      (click)="onOpenSettings()"
      title="Налаштування"
      aria-label="Налаштування"
    >
      <app-icon name="settings" [size]="16" />
    </button>
  </div>
</header>
