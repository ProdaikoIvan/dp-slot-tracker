@if (center(); as c) {
  <div class="active-center-card">
    <div class="center-header">
      <span class="flag-icon">{{ c.flag }}</span>
      <div class="center-meta">
        <h2 class="center-name">{{ c.name }}, {{ c.country }}</h2>
        @if (c.address) {
          <p class="center-address">
            <app-icon name="location" [size]="12" />
            <span>{{ c.address }}</span>
          </p>
        }
      </div>

      <button
        type="button"
        class="btn-toggle-tracker"
        [class.is-running]="isRunning()"
        (click)="onToggleTracker()"
        [attr.title]="isRunning() ? 'Зупинити відстеження' : 'Запустити відстеження'"
        [attr.aria-label]="isRunning() ? 'Зупинити відстеження' : 'Запустити відстеження'"
      >
        @if (isRunning()) {
          <app-icon name="stop" [size]="16" />
        } @else {
          <app-icon name="play" [size]="16" />
        }
      </button>
    </div>

    @if (!isOnQueueTab() && targetTabId()) {
      <button type="button" class="btn-focus-tab" (click)="focusQueueTab()">
        <span>Перейти до вкладки запису</span>
        <app-icon name="external-link" [size]="13" />
      </button>
    }

    <app-tracker-panel class="card-tracker-panel" />
  </div>
}
